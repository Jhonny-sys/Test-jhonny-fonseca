<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes | Prueba Técnica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h2 mb-1">Gestión de clientes</h1>
        <p class="text-secondary mb-0">Crear, consultar y editar clientes.</p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-success" href="/api/reportes/clientes/excel">Exportar Excel</a>
        <button class="btn btn-primary" type="button" id="nuevoBtn">Crear cliente</button>
      </div>
    </div>

    <div id="alerta" class="alert d-none" role="alert"></div>

    <section class="card shadow-sm mb-4 d-none" id="formularioCard">
      <div class="card-body">
        <h2 class="h4 mb-4" id="tituloFormulario">Crear cliente</h2>
        <form id="clienteForm" class="row g-3" novalidate autocomplete="off">
          <input id="clnId" type="hidden">
          <div class="col-md-4">
            <label class="form-label" for="tipoId">Tipo de identificación <span class="text-primary" data-bs-toggle="tooltip" title="Seleccione el documento con el que se identifica el cliente.">ⓘ</span></label>
            <select class="form-select" id="tipoId" required>
              <option value="">Seleccione...</option>
              <option value="1">Cédula</option>
              <option value="2">NIT</option>
              <option value="3">Cédula de extranjería</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="identificacion">Identificación <span class="text-primary" data-bs-toggle="tooltip" title="Digite el número del documento. No puede repetirse en otro cliente.">ⓘ</span></label>
            <input class="form-control" id="identificacion" maxlength="30" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="razonSocial">Razón social <span class="text-primary" data-bs-toggle="tooltip" title="Ingrese el nombre legal de la persona o empresa, por ejemplo: Comercializadora ABC S.A.S.">ⓘ</span></label>
            <input class="form-control" id="razonSocial" maxlength="150" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="pais">País <span class="text-primary" data-bs-toggle="tooltip" title="Puede escribir para buscar dentro de los países disponibles.">ⓘ</span></label>
            <select class="form-select" id="pais" required></select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="departamento">Departamento <span class="text-primary" data-bs-toggle="tooltip" title="Se habilita después de seleccionar un país. Puede escribir para buscar.">ⓘ</span></label>
            <select class="form-select" id="departamento" required disabled></select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="ciudad">Municipio <span class="text-primary" data-bs-toggle="tooltip" title="Se habilita después de seleccionar un departamento. Puede escribir para buscar.">ⓘ</span></label>
            <select class="form-select" id="ciudad" required disabled></select>
          </div>
          <div class="col-12 d-flex gap-2 justify-content-end">
            <button class="btn btn-outline-secondary" id="cancelarBtn" type="button">Cancelar</button>
            <button class="btn btn-success" type="submit">Guardar cliente</button>
          </div>
        </form>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-dark"><tr><th>Id</th><th>Tipo</th><th>Identificación</th><th>Razón social</th><th>Departamento</th><th>Municipio</th><th></th></tr></thead>
          <tbody id="clientesTabla"><tr><td colspan="7" class="text-center text-secondary py-4">Cargando clientes...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
  <script>
    const api = '/api';
    const $ = id => document.getElementById(id);
    const tipoTexto = { 1: 'Cédula', 2: 'NIT', 3: 'Cédula de extranjería' };
    const selectores = {};

    function alerta(mensaje, tipo = 'success') {
      const elemento = $('alerta');
      elemento.className = `alert alert-${tipo}`;
      elemento.textContent = mensaje;
    }

    function ocultarAlerta() { $('alerta').className = 'alert d-none'; }

    async function request(url, opciones = {}) {
      const respuesta = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opciones });
      if (!respuesta.ok) {
        const error = await respuesta.json().catch(() => ({}));
        throw new Error(error.mensaje || 'No fue posible completar la operación.');
      }
      return respuesta.status === 204 ? null : respuesta.json();
    }

    function cargarOpciones(id, items, textoInicial, deshabilitado = false) {
      const selector = selectores[id];
      selector.clear(true);
      selector.clearOptions();
      selector.addOptions(items.map(item => ({ value: String(item.codigo), text: item.nombre })));
      selector.settings.placeholder = textoInicial;
      selector.control_input.placeholder = textoInicial;
      selector.setValue('', true);
      deshabilitado ? selector.disable() : selector.enable();
    }

    async function cargarPaises(seleccionado = '') {
      const paises = await request(`${api}/ubicaciones/paises`);
      cargarOpciones('pais', paises, 'Seleccione...');
      selectores.pais.setValue(String(seleccionado), true);
    }

    async function cargarDepartamentos(pais, seleccionado = '') {
      cargarOpciones('departamento', [], 'Seleccione un país...', !pais);
      cargarOpciones('ciudad', [], 'Seleccione un departamento...', true);
      if (!pais) return;
      const departamentos = await request(`${api}/ubicaciones/paises/${pais}/departamentos`);
      cargarOpciones('departamento', departamentos, 'Seleccione...');
      selectores.departamento.setValue(String(seleccionado), true);
    }

    async function cargarCiudades(departamento, seleccionado = '') {
      cargarOpciones('ciudad', [], 'Seleccione un departamento...', !departamento);
      if (!departamento) return;
      const ciudades = await request(`${api}/ubicaciones/departamentos/${departamento}/ciudades`);
      cargarOpciones('ciudad', ciudades, 'Seleccione...');
      selectores.ciudad.setValue(String(seleccionado), true);
    }

    async function cargarClientes() {
      const clientes = await request(`${api}/clientes`);
      $('clientesTabla').innerHTML = clientes.length ? clientes.map(cliente => `
        <tr><td>${cliente.clnId}</td><td>${tipoTexto[cliente.clnTipoId] || cliente.clnTipoId}</td>
        <td>${cliente.clnNumeroIdentificacion}</td><td>${cliente.clnRazonSocial}</td><td>${cliente.departamento}</td><td>${cliente.municipio}</td>
        <td class="text-end"><button class="btn btn-sm btn-outline-primary" onclick="editar(${cliente.clnId})">Editar</button></td></tr>`).join('')
        : '<tr><td colspan="7" class="text-center text-secondary py-4">No hay clientes registrados.</td></tr>';
    }

    async function editar(id) {
      try {
        ocultarAlerta();
        const cliente = await request(`${api}/clientes/${id}`);
        $('clnId').value = cliente.clnId;
        $('tipoId').value = cliente.clnTipoId;
        $('identificacion').value = cliente.clnNumeroIdentificacion;
        $('razonSocial').value = cliente.clnRazonSocial;
        await cargarPaises(cliente.clnPaisCodigo);
        await cargarDepartamentos(cliente.clnPaisCodigo, cliente.clnDptColCodigoDane);
        await cargarCiudades(cliente.clnDptColCodigoDane, cliente.clnDvsPltColCodigoDane);
        $('tituloFormulario').textContent = 'Editar cliente';
        $('formularioCard').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) { alerta(error.message, 'danger'); }
    }

    function nuevo() {
      $('clienteForm').reset();
      $('clnId').value = '';
      selectores.pais.setValue('', true);
      cargarOpciones('departamento', [], 'Seleccione un país...', true);
      cargarOpciones('ciudad', [], 'Seleccione un departamento...', true);
      $('tituloFormulario').textContent = 'Crear cliente';
      $('formularioCard').classList.remove('d-none');
      ocultarAlerta();
    }

    function iniciarSelectores() {
      ['pais', 'departamento', 'ciudad'].forEach(id => {
        selectores[id] = new TomSelect(`#${id}`, {
          create: false,
          placeholder: 'Escriba para buscar...',
          controlInput: '<input type="text" autocomplete="off" spellcheck="false" tabindex="0">'
        });
      });
      selectores.departamento.disable();
      selectores.ciudad.disable();
      selectores.pais.on('change', valor => cargarDepartamentos(valor));
      selectores.departamento.on('change', valor => cargarCiudades(valor));
      selectores.pais.on('focus', () => {
        if (selectores.pais.getValue()) selectores.pais.clear();
      });
      selectores.departamento.on('focus', () => {
        if (selectores.departamento.getValue()) selectores.departamento.clear();
      });
      selectores.ciudad.on('focus', () => {
        if (selectores.ciudad.getValue()) selectores.ciudad.clear();
      });
      document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(elemento => new bootstrap.Tooltip(elemento));
    }

    $('nuevoBtn').addEventListener('click', nuevo);
    $('cancelarBtn').addEventListener('click', () => $('formularioCard').classList.add('d-none'));
    $('clienteForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (!event.target.checkValidity()) return event.target.reportValidity();
      const id = $('clnId').value;
      const cliente = {
        clnTipoId: Number($('tipoId').value), clnNumeroIdentificacion: $('identificacion').value,
        clnRazonSocial: $('razonSocial').value, clnPaisCodigo: Number(selectores.pais.getValue()),
        clnDptColCodigoDane: Number(selectores.departamento.getValue()), clnDvsPltColCodigoDane: Number(selectores.ciudad.getValue())
      };
      try {
        await request(id ? `${api}/clientes/${id}` : `${api}/clientes`, { method: id ? 'PUT' : 'POST', body: JSON.stringify(cliente) });
        alerta(id ? 'Cliente actualizado correctamente.' : 'Cliente creado correctamente.');
        $('formularioCard').classList.add('d-none');
        await cargarClientes();
      } catch (error) { alerta(error.message, 'danger'); }
    });

    iniciarSelectores();
    Promise.all([cargarPaises(), cargarClientes()]).catch(error => alerta(error.message, 'danger'));
  </script>
</body>
</html>
