<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes | Prueba Técnica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h2 mb-1">Gestión de clientes</h1>
        <p class="text-secondary mb-0">Crear, consultar y editar clientes.</p>
      </div>
      <button class="btn btn-primary" type="button" id="nuevoBtn">Crear cliente</button>
    </div>

    <div id="alerta" class="alert d-none" role="alert"></div>

    <section class="card shadow-sm mb-4 d-none" id="formularioCard">
      <div class="card-body">
        <h2 class="h4 mb-4" id="tituloFormulario">Crear cliente</h2>
        <form id="clienteForm" class="row g-3" novalidate>
          <input id="clnId" type="hidden">
          <div class="col-md-4">
            <label class="form-label" for="tipoId">Tipo de identificación</label>
            <select class="form-select" id="tipoId" required>
              <option value="">Seleccione...</option>
              <option value="1">Cédula</option>
              <option value="2">NIT</option>
              <option value="3">Cédula de extranjería</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="identificacion">Identificación</label>
            <input class="form-control" id="identificacion" maxlength="30" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="razonSocial">Razón social</label>
            <input class="form-control" id="razonSocial" maxlength="150" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="pais">País</label>
            <select class="form-select" id="pais" required><option value="">Seleccione...</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="departamento">Departamento</label>
            <select class="form-select" id="departamento" required disabled><option value="">Seleccione un país...</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="ciudad">Municipio</label>
            <select class="form-select" id="ciudad" required disabled><option value="">Seleccione un departamento...</option></select>
          </div>
          <div class="col-12 d-flex gap-2 justify-content-end">
            <button class="btn btn-outline-secondary" id="cancelarBtn" type="button">Cancelar</button>
            <button class="btn btn-success" type="submit">Guardar cliente</button>
          </div>
        </form>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-dark"><tr><th>Id</th><th>Tipo</th><th>Identificación</th><th>Razón social</th><th>Departamento</th><th>Municipio</th><th></th></tr></thead>
          <tbody id="clientesTabla"><tr><td colspan="7" class="text-center text-secondary py-4">Cargando clientes...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const api = '/api';
    const $ = id => document.getElementById(id);
    const tipoTexto = { 1: 'Cédula', 2: 'NIT', 3: 'Cédula de extranjería' };

    function alerta(mensaje, tipo = 'success') {
      const elemento = $('alerta');
      elemento.className = `alert alert-${tipo}`;
      elemento.textContent = mensaje;
    }

    function ocultarAlerta() { $('alerta').className = 'alert d-none'; }

    async function request(url, opciones = {}) {
      const respuesta = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opciones });
      if (!respuesta.ok) {
        const error = await respuesta.json().catch(() => ({}));
        throw new Error(error.mensaje || 'No fue posible completar la operación.');
      }
      return respuesta.status === 204 ? null : respuesta.json();
    }

    function opciones(items, textoInicial) {
      return `<option value="">${textoInicial}</option>` + items.map(x => `<option value="${x.codigo}">${x.nombre}</option>`).join('');
    }

    async function cargarPaises(seleccionado = '') {
      const paises = await request(`${api}/ubicaciones/paises`);
      $('pais').innerHTML = opciones(paises, 'Seleccione...');
      $('pais').value = seleccionado;
    }

    async function cargarDepartamentos(pais, seleccionado = '') {
      $('departamento').disabled = !pais;
      $('ciudad').disabled = true;
      $('ciudad').innerHTML = '<option value="">Seleccione un departamento...</option>';
      if (!pais) return;
      const departamentos = await request(`${api}/ubicaciones/paises/${pais}/departamentos`);
      $('departamento').innerHTML = opciones(departamentos, 'Seleccione...');
      $('departamento').value = seleccionado;
    }

    async function cargarCiudades(departamento, seleccionado = '') {
      $('ciudad').disabled = !departamento;
      if (!departamento) return;
      const ciudades = await request(`${api}/ubicaciones/departamentos/${departamento}/ciudades`);
      $('ciudad').innerHTML = opciones(ciudades, 'Seleccione...');
      $('ciudad').value = seleccionado;
    }

    async function cargarClientes() {
      const clientes = await request(`${api}/clientes`);
      $('clientesTabla').innerHTML = clientes.length ? clientes.map(cliente => `
        <tr><td>${cliente.clnId}</td><td>${tipoTexto[cliente.clnTipoId] || cliente.clnTipoId}</td>
        <td>${cliente.clnNumeroIdentificacion}</td><td>${cliente.clnRazonSocial}</td><td>${cliente.departamento}</td><td>${cliente.municipio}</td>
        <td class="text-end"><button class="btn btn-sm btn-outline-primary" onclick="editar(${cliente.clnId})">Editar</button></td></tr>`).join('')
        : '<tr><td colspan="7" class="text-center text-secondary py-4">No hay clientes registrados.</td></tr>';
    }

    async function editar(id) {
      try {
        ocultarAlerta();
        const cliente = await request(`${api}/clientes/${id}`);
        $('clnId').value = cliente.clnId;
        $('tipoId').value = cliente.clnTipoId;
        $('identificacion').value = cliente.clnNumeroIdentificacion;
        $('razonSocial').value = cliente.clnRazonSocial;
        await cargarPaises(cliente.clnPaisCodigo);
        await cargarDepartamentos(cliente.clnPaisCodigo, cliente.clnDptColCodigoDane);
        await cargarCiudades(cliente.clnDptColCodigoDane, cliente.clnDvsPltColCodigoDane);
        $('tituloFormulario').textContent = 'Editar cliente';
        $('formularioCard').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) { alerta(error.message, 'danger'); }
    }

    function nuevo() {
      $('clienteForm').reset();
      $('clnId').value = '';
      $('departamento').disabled = true;
      $('ciudad').disabled = true;
      $('departamento').innerHTML = '<option value="">Seleccione un país...</option>';
      $('ciudad').innerHTML = '<option value="">Seleccione un departamento...</option>';
      $('tituloFormulario').textContent = 'Crear cliente';
      $('formularioCard').classList.remove('d-none');
      ocultarAlerta();
    }

    $('nuevoBtn').addEventListener('click', nuevo);
    $('cancelarBtn').addEventListener('click', () => $('formularioCard').classList.add('d-none'));
    $('pais').addEventListener('change', event => cargarDepartamentos(event.target.value));
    $('departamento').addEventListener('change', event => cargarCiudades(event.target.value));
    $('clienteForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (!event.target.checkValidity()) return event.target.reportValidity();
      const id = $('clnId').value;
      const cliente = {
        clnTipoId: Number($('tipoId').value), clnNumeroIdentificacion: $('identificacion').value,
        clnRazonSocial: $('razonSocial').value, clnPaisCodigo: Number($('pais').value),
        clnDptColCodigoDane: Number($('departamento').value), clnDvsPltColCodigoDane: Number($('ciudad').value)
      };
      try {
        await request(id ? `${api}/clientes/${id}` : `${api}/clientes`, { method: id ? 'PUT' : 'POST', body: JSON.stringify(cliente) });
        alerta(id ? 'Cliente actualizado correctamente.' : 'Cliente creado correctamente.');
        $('formularioCard').classList.add('d-none');
        await cargarClientes();
      } catch (error) { alerta(error.message, 'danger'); }
    });

    Promise.all([cargarPaises(), cargarClientes()]).catch(error => alerta(error.message, 'danger'));
  </script>
</body>
</html>
